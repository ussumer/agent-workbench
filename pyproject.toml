[project]
name = "rush-harness"
version = "0.1.0"
description = "Procurement Harness demo: FastAPI + DeepAgents + MCP + MongoDB + OpenSandbox over a Java mini-ERP"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Web / API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "httpx>=0.28,<1.0",
    "python-multipart>=0.0.20",
    "jinja2>=3.1,<4.0",
    # Config / validation
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    # Agent framework (DeepAgents + LangGraph 1.x line)
    "deepagents>=0.7,<0.8",
    "langchain>=1.4,<2.0",
    "langchain-core>=1.6,<2.0",
    # Chat model. The runtime is configured with a generic MODEL_BASE_URL / MODEL_ID
    # pair, so the OpenAI-compatible client is the right fit: it drives any provider
    # that speaks the OpenAI wire format (the one this project talks to does).
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.2,<2.0",
    "langgraph-sdk>=0.4,<1.0",
    "langchain-mongodb>=0.8",
    "langgraph-checkpoint-mongodb>=0.5,<1.0",
    "langgraph-store-mongodb>=0.4,<1.0",
    # MCP
    "mcp>=1.24,<2.0",
    "langchain-mcp-adapters>=0.3,<0.4",
    # Storage
    "pymongo>=4.12,<4.18",
    # Sandbox client. CORRECTED in T08: the `opensandbox-sdk` distribution is a
    # different API generation (it speaks `X-API-Key` and `/api/sandboxes`), and every
    # published version returns 401/404 against opensandbox-server 0.2.3. The
    # `opensandbox` distribution is the one generated from the server's own OpenAPI
    # spec: it sends `OPEN-SANDBOX-API-KEY` and ships both async and sync clients.
    "opensandbox>=0.1.16,<0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-timeout>=2.3,<3.0",
    "ruff>=0.9,<0.15",
    "mypy>=1.14,<2.0",
    "respx>=0.22,<1.0",
    "jsonschema>=4.23,<5.0",
    # OpenSandbox control service. It is local test/demo infrastructure (it drives the
    # Docker daemon to create execution containers), so it belongs to the dev group
    # rather than the application's runtime dependencies.
    "opensandbox-server>=0.2.3,<0.3",
    # T23: browser screenshots for the live demo. Python rather than the Node toolchain so
    # the evidence tooling sits beside the rest of the test tooling and is installed by the
    # same lock — the browser binary itself is fetched by `playwright install chromium`,
    # which is a documented setup step rather than a package.
    "playwright>=1.63,<2.0",
]

# The official Agent Protocol server (langgraph-cli / langgraph-api /
# langgraph-runtime-inmem) is deliberately NOT a dependency of this project, and cannot
# be: langgraph-api 0.14.x pins grpcio>=1.81,<1.82 while opensandbox-server requires
# grpcio>=1.83, so no resolution exists that contains both. It is provisioned into its
# own virtual environment by tests/fixtures/agent_protocol_service.py instead, which
# also matches how the async agent service is deployed (a separate process).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-timeout>=2.3,<3.0",
    "ruff>=0.9,<0.15",
    "mypy>=1.14,<2.0",
    "respx>=0.22,<1.0",
    "jsonschema>=4.23,<5.0",
    "opensandbox-server>=0.2.3,<0.3",
    "playwright>=1.63,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "unit: deterministic, no network, fakes allowed",
    "contract: schema/contract validation",
    "integration: real local services (Java/Mongo/MCP/OpenSandbox/HTTP)",
    "live: real model, search, chart and every local service",
]
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = false
