[project]
name = "rush-harness"
version = "0.1.0"
description = "Procurement Harness demo: FastAPI + DeepAgents + MCP + MongoDB + OpenSandbox over a Java mini-ERP"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Web / API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "httpx>=0.28,<1.0",
    "python-multipart>=0.0.20",
    "jinja2>=3.1,<4.0",
    # Config / validation
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    # Agent framework (DeepAgents + LangGraph 1.x line)
    "deepagents>=0.7,<0.8",
    "langchain>=1.4,<2.0",
    "langchain-core>=1.6,<2.0",
    "langgraph>=1.2,<2.0",
    "langgraph-sdk>=0.4,<1.0",
    "langchain-mongodb>=0.8",
    "langgraph-checkpoint-mongodb>=0.5,<1.0",
    "langgraph-store-mongodb>=0.4,<1.0",
    # MCP
    "mcp>=1.24,<2.0",
    "langchain-mcp-adapters>=0.3,<0.4",
    # Storage
    "pymongo>=4.12,<4.18",
    # Sandbox SDK (exact capability verified in T08)
    "opensandbox-sdk>=0.3,<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-timeout>=2.3,<3.0",
    "ruff>=0.9,<0.15",
    "mypy>=1.14,<2.0",
    "respx>=0.22,<1.0",
    "jsonschema>=4.23,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-timeout>=2.3,<3.0",
    "ruff>=0.9,<0.15",
    "mypy>=1.14,<2.0",
    "respx>=0.22,<1.0",
    "jsonschema>=4.23,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "unit: deterministic, no network, fakes allowed",
    "contract: schema/contract validation",
    "integration: real local services (Java/Mongo/MCP/OpenSandbox/HTTP)",
    "live: real model, search, chart and every local service",
]
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = false
