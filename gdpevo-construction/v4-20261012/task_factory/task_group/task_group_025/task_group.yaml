train_tasks:
- task_id: train_001
  input: train_tasks/001/input/
  prompt_txt: train_tasks/001/input/prompt.txt
  payloads:
  - train_tasks/001/input/payloads/answer_template.json
  notes: train_tasks/001/notes/notes.md
  output: train_tasks/001/output/
  answer_json: train_tasks/001/output/answer.json
  eval:
    script: train_tasks/001/eval/eval.sh
    files:
    - train_tasks/001/eval/eval.sh
    - train_tasks/001/eval/evaluate.py
    rubric:
    - point_id: N1
      goal: Reconstruct approved full fiscal-year base and premium vehicle-set demand
        and lifecycle total.
      weight: 2
    - point_id: N2
      goal: Resolve binding original versus amended commercial coverage for each supplier,
        variant and future fiscal period as known at the decision date.
      weight: 2
    - point_id: N3
      goal: Reconcile current engineering and quality qualification, complete variant
        coverage and remaining validation actions.
      weight: 2
    - point_id: N4
      goal: Determine each supplier's annual full-award capacity deficits against
        available allocations.
      weight: 2
    - point_id: N5
      goal: Calculate earliest nomination readiness and calendar launch gaps for every
        candidate.
      weight: 2
    - point_id: N6
      goal: Compute all candidate cashflows and discounted financial exposures with
        currency and UOM normalization, graduated tiers, shared tooling cap and upfront
        equal development allocation.
      weight: 3
- task_id: train_002
  input: train_tasks/002/input/
  prompt_txt: train_tasks/002/input/prompt.txt
  payloads:
  - train_tasks/002/input/payloads/answer_template.json
  notes: train_tasks/002/notes/notes.md
  output: train_tasks/002/output/
  answer_json: train_tasks/002/output/answer.json
  eval:
    script: train_tasks/002/eval/eval.sh
    files:
    - train_tasks/002/eval/eval.sh
    - train_tasks/002/eval/evaluate.py
    rubric:
    - point_id: N1
      goal: Reconstruct approved full-year vehicle-set demand and variant mix for
        2027-2030.
      weight: 2
    - point_id: N2
      goal: Determine binding commercial applicability and variant-period coverage
        for every candidate.
      weight: 2
    - point_id: N3
      goal: Report engineering and quality qualification, technical coverage and open
        actions.
      weight: 2
    - point_id: N4
      goal: Compare approved annual full demand with each supplier allocation and
        report actual shortfalls.
      weight: 2
    - point_id: N5
      goal: Determine candidate readiness dates and calendar launch gaps.
      weight: 2
    - point_id: N6
      goal: Calculate complete candidate and variant discounted financial exposure
        with annual parts, tooling and upfront development charges.
      weight: 3
- task_id: train_003
  input: train_tasks/003/input/
  prompt_txt: train_tasks/003/input/prompt.txt
  payloads:
  - train_tasks/003/input/payloads/answer_template.json
  notes: train_tasks/003/notes/notes.md
  output: train_tasks/003/output/
  answer_json: train_tasks/003/output/answer.json
  eval:
    script: train_tasks/003/eval/eval.sh
    files:
    - train_tasks/003/eval/eval.sh
    - train_tasks/003/eval/evaluate.py
    rubric:
    - point_id: R1
      goal: Reconcile actual settled eligible historic tooling and R&D principal.
      weight: 2
    - point_id: R2
      goal: Separate contractual refund claim, received cash and outstanding balances.
      weight: 2
    - point_id: R3
      goal: Resolve tooling title, reusable asset disposition and noncash transfer
        credit.
      weight: 2
    - point_id: R4
      goal: Calculate gross future quotation cash flows and NPV excluding historical
        principal, claims and asset offsets.
      weight: 3
    - point_id: R5
      goal: Identify the effective technical qualification and conditions of authorized
        alternatives.
      weight: 2
    - point_id: R6
      goal: Reconcile annual available allocation and sequential readiness against
        contractual launch.
      weight: 2
    - point_id: R7
      goal: Respect incumbent termination and current external-award authorization
        without inventing future blanket restrictions.
      weight: 1
- task_id: train_004
  input: train_tasks/004/input/
  prompt_txt: train_tasks/004/input/prompt.txt
  payloads:
  - train_tasks/004/input/payloads/answer_template.json
  notes: train_tasks/004/notes/notes.md
  output: train_tasks/004/output/
  answer_json: train_tasks/004/output/answer.json
  eval:
    script: train_tasks/004/eval/eval.sh
    files:
    - train_tasks/004/eval/eval.sh
    - train_tasks/004/eval/evaluate.py
    rubric:
    - point_id: N1
      goal: Reconstruct approved full-year variant demand and four-year mix.
      weight: 2
    - point_id: N2
      goal: Resolve dated commercial applicability and complete variant-period coverage.
      weight: 2
    - point_id: N3
      goal: Determine technical admissibility, coverage and remaining required actions.
      weight: 2
    - point_id: N4
      goal: Compute each candidate annual allocation shortfall against approved demand.
      weight: 2
    - point_id: N5
      goal: Determine earliest readiness and calendar-day gap to launch.
      weight: 2
    - point_id: N6
      goal: Compute all candidate and variant cashflow exposure with tiers, UOM, currency,
        tooling, R&D and discounting.
      weight: 3
- task_id: train_005
  input: train_tasks/005/input/
  prompt_txt: train_tasks/005/input/prompt.txt
  payloads:
  - train_tasks/005/input/payloads/answer_template.json
  notes: train_tasks/005/notes/notes.md
  output: train_tasks/005/output/
  answer_json: train_tasks/005/output/answer.json
  eval:
    script: train_tasks/005/eval/eval.sh
    files:
    - train_tasks/005/eval/eval.sh
    - train_tasks/005/eval/evaluate.py
    rubric:
    - point_id: R1
      goal: Settled eligible historical principal by tooling and development category,
        excluding unpaid commitments.
      weight: 2
    - point_id: R2
      goal: Cash refund entitlement, actual partial receipts and outstanding claims
        by category and total.
      weight: 2
    - point_id: R3
      goal: Customer tooling title, reusable asset disposition and noncash transfer
        credit in its own currency.
      weight: 2
    - point_id: R4
      goal: Gross future operating, capped tooling, upfront development and transition
        exposure and NPV by candidate, before assets or historic claims.
      weight: 3
    - point_id: R5
      goal: Technical qualification and conditional actions of all authorized alternatives.
      weight: 2
    - point_id: R6
      goal: Annual production capacity and sequential transfer/requalification launch
        recovery dates and gaps.
      weight: 2
    - point_id: R7
      goal: Executed program-change and external-award scope without an unsupported
        future-program supplier ban.
      weight: 1
