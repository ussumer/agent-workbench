server:
  address: 0.0.0.0
  port: 9025

spring:
  application:
    name: procurement-erp
  datasource:
    # File-backed H2 so restart persistence is real. A memory URL must never be
    # used to claim persistence; tests point ERP_DB_PATH at their own file.
    # AUTO_SERVER lets an operator inspect the file while the service runs; LOCK_TIMEOUT gives a
    # concurrent duplicate-key writer time to be resolved by the winner's commit instead of
    # surfacing a lock timeout.
    url: jdbc:h2:file:${ERP_DB_PATH:./data/erp/rush_harness_demo};AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 8
      pool-name: erp-pool
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql,classpath:sourcing-schema.sql
      continue-on-error: false
  h2:
    console:
      enabled: false
  jackson:
    default-property-inclusion: always
    property-naming-strategy: SNAKE_CASE # JSON fields use snake_case consistently
    serialization:
      write-dates-as-timestamps: false

erp:
  seed:
    # Single fixed seed source from T01; parse failures stop startup without hardcoded fallback data
    path: ${ERP_SEED_PATH:../fixtures/seed-v1.json}
    fallback-path: fixtures/seed-v1.json
  security:
    # Internal service token for the MCP gateway; never provided to browsers or sandboxes.
    # Local demo permits an overridable default; production must set ERP_SERVICE_TOKEN.
    service-token: ${ERP_SERVICE_TOKEN:local-demo-service-token}
    header-name: X-Service-Token

logging:
  level:
    root: INFO
    com.rushharness.erp: INFO

sourcing:
  seed-path: ${SOURCING_SEED_PATH:../seed.json}

